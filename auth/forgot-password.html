<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — GradeFlow Platform</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, rgba(30, 58, 138, 0.05), rgba(16, 185, 129, 0.03)), var(--bg-app);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary-light), var(--secondary));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 24px;
      color: #ffffff;
      margin: 0 auto 16px;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
    }
    .success-msg {
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--success);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">GF</div>
        <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 8px;">Reset Password</h2>
        <p style="color: var(--text-secondary); font-size: 14px;">Enter your institutional email to receive reset instructions.</p>
      </div>

      <!-- Success Box -->
      <div class="success-msg" id="success-box">
        Password reset instructions have been sent to your institutional email.
      </div>

      <!-- Forgot Password Form -->
      <form id="forgot-form">
        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label" for="email">Institutional Email</label>
          <input type="email" id="email" class="form-control" placeholder="name@fudmas.edu.ng" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; height: 46px;">
          <span>Request Reset Link</span>
        </button>
      </form>

      <!-- Footer Link -->
      <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted);">
        Remember your password? <a href="/auth/login.html" class="auth-link">Sign In</a>
      </div>
    </div>
  </div>

  <script src="/js/data.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById("forgot-form").addEventListener("submit", (e) => {
      e.preventDefault();
      document.getElementById("success-box").style.display = "block";
      document.getElementById("email").value = "";
    });
  </script>
</body>
</html>
