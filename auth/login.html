<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Login — GradeFlow Platform</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, rgba(30, 58, 138, 0.05), rgba(16, 185, 129, 0.03)), var(--bg-app);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary-light), var(--secondary));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 24px;
      color: #ffffff;
      margin: 0 auto 16px;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
    }
    .role-tabs {
      display: flex;
      background-color: var(--bg-app);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }
    .role-tab {
      flex-grow: 1;
      text-align: center;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .role-tab.active {
      background-color: var(--bg-card);
      color: var(--primary-light);
      box-shadow: var(--shadow-sm);
    }
    .auth-footer-links {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
      font-size: 13px;
    }
    .auth-link {
      color: var(--primary-light);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-link:hover {
      text-decoration: underline;
    }
    .error-msg {
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">GF</div>
        <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 8px;">GradeFlow System</h2>
        <p style="color: var(--text-secondary); font-size: 14px;">Online Project Grading & Evaluation</p>
      </div>

      <!-- Role Tabs -->
      <div class="role-tabs" id="role-tabs-container">
        <div class="role-tab active" data-role="student">Student</div>
        <div class="role-tab" data-role="supervisor">Faculty</div>
        <div class="role-tab" data-role="admin">Registrar Admin</div>
      </div>

      <!-- Error Box -->
      <div class="error-msg" id="error-box"></div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Institutional Email</label>
          <input type="email" id="email" class="form-control" placeholder="name@fudmas.edu.ng" required>
        </div>
        
        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; height: 46px;">
          <span>Sign In</span>
        </button>
      </form>

      <!-- Auth Footer -->
      <div class="auth-footer-links">
        <a href="/auth/forgot-password.html" class="auth-link">Forgot Password?</a>
        <span style="color: var(--text-muted);">New Student? <a href="/auth/register.html" class="auth-link">Register</a></span>
      </div>
    </div>
  </div>

  <script src="/js/data.js"></script>
  <script src="/js/app.js"></script>
  <script>
    // Handle tab switching
    const tabs = document.querySelectorAll('.role-tab');
    let currentRole = "student";

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentRole = tab.dataset.role;
      });
    });

    // Check query params to pre-select role tab
    const urlParams = new URLSearchParams(window.location.search);
    const initialRole = urlParams.get('role');
    if (initialRole && ["student", "supervisor", "admin"].includes(initialRole)) {
      const activeTab = document.querySelector(`.role-tab[data-role="${initialRole}"]`);
      if (activeTab) {
        activeTab.click();
      }
    }

    // Prefill account emails for ease of assessment
    const prefillEmails = {
      student: "sarah.j@fudmas.edu.ng",
      supervisor: "akinleye.j@fudmas.edu.ng",
      admin: "admin@fudmas.edu.ng"
    };

    // Auto fill email helper when tab is clicked
    const emailField = document.getElementById("email");
    emailField.value = prefillEmails[currentRole];
    tabs.forEach(t => {
      t.addEventListener('click', () => {
        emailField.value = prefillEmails[t.dataset.role];
      });
    });

    // Handle Form Submit
    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = emailField.value;
      const errorBox = document.getElementById("error-box");
      
      errorBox.style.display = "none";
      
      const res = GFApp.login(email, "password", currentRole);
      
      if (res.success) {
        // Redirect to dashboard
        window.location.href = `/${currentRole}/dashboard.html`;
      } else {
        errorBox.textContent = res.message;
        errorBox.style.display = "block";
      }
    });
  </script>
</body>
</html>
