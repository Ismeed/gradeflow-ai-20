<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Project Document — GradeFlow System</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Container -->
    <aside class="sidebar" id="sidebar-container"></aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Bar Container -->
      <header class="top-bar" id="topbar-container"></header>

      <!-- Content Wrapper -->
      <div class="content-wrapper">
        
        <div class="card" style="max-width: 800px; margin: 0 auto;">
          <div class="card-header">
            <h3 class="card-title">Project Submission Form</h3>
          </div>

          <form id="submission-form">
            <!-- Student Read-Only Metadata Grid -->
            <div class="grid-2" style="margin-bottom: 20px;">
              <div class="form-group">
                <label class="form-label">Student Name</label>
                <input type="text" id="studentName" class="form-control" readonly style="background-color: var(--bg-app);">
              </div>
              <div class="form-group">
                <label class="form-label">Registration / Matric Number</label>
                <input type="text" id="regNo" class="form-control" readonly style="background-color: var(--bg-app);">
              </div>
            </div>

            <div class="grid-2" style="margin-bottom: 20px;">
              <div class="form-group">
                <label class="form-label">Department</label>
                <input type="text" id="department" class="form-control" readonly style="background-color: var(--bg-app);">
              </div>
              <div class="form-group">
                <label class="form-label" for="supervisorSelect">Assigned Supervisor</label>
                <select id="supervisorSelect" class="form-control" required>
                  <!-- Supervisors will be dynamically loaded -->
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="projectTitle">Research Project Title</label>
              <input type="text" id="projectTitle" class="form-control" placeholder="e.g. Design and Implementation of an Algorithmic Load Balancer" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="abstract">Structured Project Abstract</label>
              <textarea id="abstract" class="form-control" placeholder="Enter a comprehensive abstract (problem statement, methodology, results achieved)..." required></textarea>
            </div>

            <!-- Drag & Drop File Zone -->
            <div class="form-group" style="margin-bottom: 28px;">
              <label class="form-label">Upload Research Script (PDF or DOCX)</label>
              <div class="file-upload-zone" id="drop-zone">
                <svg class="file-upload-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <div class="file-upload-text" id="upload-status">Drag and drop your project script here, or <span style="color: var(--primary-light);">browse files</span></div>
                <div class="file-upload-hint">Supported file types: PDF, DOCX (Maximum file size: 15MB)</div>
                <input type="file" id="file-input" style="display: none;" accept=".pdf,.docx">
              </div>
            </div>

            <!-- Form Actions -->
            <div style="display: flex; gap: 12px; justify-content: flex-end; border-top: 1px solid var(--border); padding-top: 20px;">
              <a href="/student/dashboard.html" class="btn btn-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary">
                <span>Submit Assessment Script</span>
              </button>
            </div>
          </form>
        </div>

      </div>
    </main>
  </div>

  <script src="/js/data.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (GFApp.guardPage(["student"])) {
      GFApp.injectSidebar("submit");
      GFApp.injectTopbar("Upload Submission");

      const user = GFApp.getCurrentUser();
      
      // Auto populate read-only fields
      document.getElementById("studentName").value = user.name;
      document.getElementById("regNo").value = user.regNo;
      document.getElementById("department").value = user.department;

      // Populate Supervisor List
      const supervisors = GFDb.getUsers().filter(u => u.role === "supervisor");
      const supervisorSelect = document.getElementById("supervisorSelect");
      supervisorSelect.innerHTML = `<option value="">Select Supervisor</option>` + 
        supervisors.map(s => `<option value="${s.id}">${s.name} (${s.department})</option>`).join('');

      // Drag and drop zone operations
      const dropZone = document.getElementById("drop-zone");
      const fileInput = document.getElementById("file-input");
      const uploadStatus = document.getElementById("upload-status");
      let selectedFile = null;

      dropZone.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length > 0) {
          selectedFile = e.target.files[0];
          uploadStatus.innerHTML = `📄 Selected File: <strong style="color: var(--success);">${selectedFile.name}</strong> (${(selectedFile.size / (1024 * 1024)).toFixed(2)} MB)`;
        }
      });

      // Simple drop events
      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.style.borderColor = "var(--primary-light)";
      });

      dropZone.addEventListener("dragleave", () => {
        dropZone.style.borderColor = "var(--border)";
      });

      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.style.borderColor = "var(--border)";
        if (e.dataTransfer.files.length > 0) {
          selectedFile = e.dataTransfer.files[0];
          uploadStatus.innerHTML = `📄 Selected File: <strong style="color: var(--success);">${selectedFile.name}</strong> (${(selectedFile.size / (1024 * 1024)).toFixed(2)} MB)`;
        }
      });

      // Handle Submission Submit
      document.getElementById("submission-form").addEventListener("submit", (e) => {
        e.preventDefault();
        
        const title = document.getElementById("projectTitle").value;
        const abstract = document.getElementById("abstract").value;
        const supervisorId = supervisorSelect.value;
        const supervisorName = supervisorSelect.options[supervisorSelect.selectedIndex].text.split(' (')[0];

        if (!supervisorId) {
          alert("Please select a supervisor.");
          return;
        }

        if (!selectedFile) {
          // If no physical file was dropped, use mock file name
          selectedFile = { name: "project_final_manuscript.pdf" };
        }

        const newProject = {
          id: "proj-" + Date.now(),
          studentId: user.id,
          studentName: user.name,
          regNo: user.regNo,
          department: user.department,
          projectTitle: title,
          supervisorId: supervisorId,
          supervisorName: supervisorName,
          abstract: abstract,
          fileUrl: "#",
          fileName: selectedFile.name,
          submissionDate: new Date().toISOString().split('T')[0],
          status: "pending"
        };

        GFDb.addProject(newProject);
        alert("Project submitted successfully! Your supervisor has been notified.");
        window.location.href = "/student/dashboard.html";
      });
    }
  </script>
</body>
</html>
