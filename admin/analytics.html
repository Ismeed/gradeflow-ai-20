<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Analytics & Reports — GradeFlow System</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 32px;
      margin-bottom: 32px;
    }

    .chart-container {
      position: relative;
      height: 280px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Container -->
    <aside class="sidebar" id="sidebar-container"></aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Bar Container -->
      <header class="top-bar" id="topbar-container"></header>

      <!-- Content Wrapper -->
      <div class="content-wrapper">
        
        <!-- Header action bar -->
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap:16px;">
          <div>
            <h3 style="font-size: 20px; font-weight:700;">Institutional Grading Analytics</h3>
            <p style="color:var(--text-secondary); font-size:14px;">Review academic grading benchmarks, pass ratios, and supervisor distributions.</p>
          </div>
          <button class="btn btn-primary" id="csv-export-btn">
            <svg style="width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2;" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            <span>Export CSV Grade Sheet</span>
          </button>
        </div>

        <!-- Charts Grid -->
        <div class="charts-grid">
          <!-- Department Performance -->
          <div class="card">
            <div class="card-header">
              <h4 class="card-title">Average Score by Department</h4>
            </div>
            <div class="chart-container">
              <canvas id="deptScoreChart"></canvas>
            </div>
          </div>

          <!-- Pass/Fail Stats -->
          <div class="card">
            <div class="card-header">
              <h4 class="card-title">Grade Pass vs Fail Ratio</h4>
            </div>
            <div class="chart-container">
              <canvas id="passFailChart"></canvas>
            </div>
          </div>
        </div>

        <!-- Supervisor Stats Table -->
        <div class="card">
          <div class="card-header">
            <h4 class="card-title">Supervisor Grading Distributions</h4>
          </div>
          
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Supervisor Name</th>
                  <th>Department</th>
                  <th>Evaluations Completed</th>
                  <th>Average Score Awarded</th>
                </tr>
              </thead>
              <tbody id="sup-stats-body">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (GFApp.guardPage(["admin"])) {
      GFApp.injectSidebar("analytics");
      GFApp.injectTopbar("Grading Analytics & Reports");

      // Fetch active details
      const projects = GFDb.getProjects();
      const grades = GFDb.getGrades();
      const supervisors = GFDb.getUsers().filter(u => u.role === "supervisor");

      // --- 1. Compute Department Performance Scores ---
      const deptScores = {};
      const deptCounts = {};
      
      projects.forEach(p => {
        const grade = grades.find(g => g.projectId === p.id);
        if (grade) {
          if (!deptScores[p.department]) {
            deptScores[p.department] = 0;
            deptCounts[p.department] = 0;
          }
          deptScores[p.department] += grade.totalScore;
          deptCounts[p.department]++;
        }
      });

      const deptLabels = Object.keys(deptScores);
      const deptAverages = deptLabels.map(dept => (deptScores[dept] / deptCounts[dept]).toFixed(1));

      // Fallbacks if empty
      const finalDeptLabels = deptLabels.length > 0 ? deptLabels : ["Computer Science", "Software Engineering"];
      const finalDeptAverages = deptAverages.length > 0 ? deptAverages : [87, 51];

      // --- 2. Compute Pass / Fail ratio (Pass >= 50, Fail < 50) ---
      let passCount = grades.filter(g => g.totalScore >= 50).length;
      let failCount = grades.filter(g => g.totalScore < 50).length;

      if (grades.length === 0) {
        passCount = 2;
        failCount = 1;
      }

      // --- 3. Compute Supervisor distributions table ---
      const supStatsBody = document.getElementById("sup-stats-body");
      if (supervisors.length > 0) {
        supStatsBody.innerHTML = supervisors.map(s => {
          // Completed projects graded by this supervisor
          const sProjects = projects.filter(p => p.supervisorId === s.id && p.status === "graded");
          const completedCount = sProjects.length;

          let scoreSum = 0;
          sProjects.forEach(sp => {
            const spGrade = grades.find(g => g.projectId === sp.id);
            if (spGrade) {
              scoreSum += spGrade.totalScore;
            }
          });

          const avgScore = completedCount > 0 ? (scoreSum / completedCount).toFixed(1) : "--";

          return `
            <tr>
              <td><strong>${s.name}</strong></td>
              <td>${s.department}</td>
              <td><span style="font-weight:700; color:var(--primary-light);">${completedCount}</span></td>
              <td><span style="font-weight:700; color:var(--secondary);">${avgScore}</span></td>
            </tr>
          `;
        }).join('');
      } else {
        supStatsBody.innerHTML = `<tr><td colspan="4" style="text-align:center;">No supervisor distribution data</td></tr>`;
      }

      // --- 4. Render Chart.js Displays ---
      
      // Bar Chart - Dept Performance
      const ctxBar = document.getElementById('deptScoreChart').getContext('2d');
      new Chart(ctxBar, {
        type: 'bar',
        data: {
          labels: finalDeptLabels,
          datasets: [{
            label: 'Average Score',
            data: finalDeptAverages,
            backgroundColor: ['rgba(37, 99, 235, 0.75)', 'rgba(16, 185, 129, 0.75)'],
            borderColor: ['#2563eb', '#10b981'],
            borderWidth: 1.5,
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true, max: 100 }
          }
        }
      });

      // Doughnut Chart - Pass Fail
      const ctxDoughnut = document.getElementById('passFailChart').getContext('2d');
      new Chart(ctxDoughnut, {
        type: 'doughnut',
        data: {
          labels: ['Passed (Score >= 50)', 'Revision required (Score < 50)'],
          datasets: [{
            data: [passCount, failCount],
            backgroundColor: ['rgba(16, 185, 129, 0.75)', 'rgba(239, 68, 68, 0.75)'],
            borderColor: ['#10b981', '#ef4444'],
            borderWidth: 1.5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false
        }
      });

      // --- 5. Export Grade Sheets to CSV Direct Download ---
      document.getElementById("csv-export-btn").addEventListener("click", () => {
        if (projects.length === 0) {
          alert("No records to export.");
          return;
        }

        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "Student Name,Reg Number,Department,Project Title,Supervisor Name,Total Score,Grade,Submission Date\n";

        projects.forEach(p => {
          const g = grades.find(grd => grd.projectId === p.id);
          const score = g ? g.totalScore : "N/A";
          const letter = g ? g.grade : "Pending";
          
          // Clean title and name for CSV parsing
          const cleanTitle = p.projectTitle.replace(/,/g, " ");
          const cleanName = p.studentName.replace(/,/g, " ");

          csvContent += `"${cleanName}","${p.regNo}","${p.department}","${cleanTitle}","${p.supervisorName}",${score},"${letter}","${p.submissionDate}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `GradeFlow_Final_Report_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });
    }
  </script>
</body>
</html>
