<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Admin Dashboard — GradeFlow System</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .admin-grid {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 32px;
    }

    @media (max-width: 992px) {
      .admin-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Container -->
    <aside class="sidebar" id="sidebar-container"></aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Bar Container -->
      <header class="top-bar" id="topbar-container"></header>

      <!-- Content Wrapper -->
      <div class="content-wrapper">
        
        <!-- Stats summary cards -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-info">
              <span class="stat-label">Total Students</span>
              <span class="stat-value" id="admin-stat-students">0</span>
            </div>
            <div class="stat-icon-wrapper">
              <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-info">
              <span class="stat-label">Faculty Staff</span>
              <span class="stat-value" id="admin-stat-faculty">0</span>
            </div>
            <div class="stat-icon-wrapper">
              <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-info">
              <span class="stat-label">Total Submissions</span>
              <span class="stat-value" id="admin-stat-submissions">0</span>
            </div>
            <div class="stat-icon-wrapper" style="color: var(--secondary);">
              <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            </div>
          </div>
        </div>

        <!-- Admin allocation & monitoring grid -->
        <div class="admin-grid">
          
          <!-- Student allocations table -->
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Supervisor Allocations</h3>
              <button class="btn btn-primary" id="open-alloc-btn" style="padding: 8px 16px; font-size:13px;">
                <span>Assign Supervisor</span>
              </button>
            </div>

            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th>Student</th>
                    <th>Department</th>
                    <th>Assigned Supervisor</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="allocation-table-body">
                  <!-- Dynamically loaded allocations -->
                </tbody>
              </table>
            </div>
          </div>

          <!-- Activity Monitoring Feed -->
          <div class="card">
            <h3 class="card-title" style="margin-bottom: 20px;">System Activity Monitor</h3>
            <div class="notification-panel" id="admin-activity-panel">
              <!-- Dynamically loaded system logs -->
            </div>
          </div>

        </div>

      </div>
    </main>
  </div>

  <!-- Interactive Assign Supervisor Modal -->
  <div class="modal-overlay" id="alloc-modal">
    <div class="modal-content">
      <h3 class="modal-title">Assign Project Supervisor</h3>
      
      <form id="alloc-form">
        <div class="form-group">
          <label class="form-label" for="modal-student-select">Select Student Project</label>
          <select id="modal-student-select" class="form-control" required>
            <!-- Loaded dynamically -->
          </select>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label" for="modal-supervisor-select">Allocate Faculty Supervisor</label>
          <select id="modal-supervisor-select" class="form-control" required>
            <!-- Loaded dynamically -->
          </select>
        </div>

        <div style="display: flex; gap: 12px; justify-content: flex-end;">
          <button type="button" class="btn btn-secondary" id="close-alloc-modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Allocation</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/data.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if (GFApp.guardPage(["admin"])) {
      GFApp.injectSidebar("dashboard");
      GFApp.injectTopbar("Registrar Operations Dashboard");

      // Load analytics counts
      function reloadStats() {
        const users = GFDb.getUsers();
        const projects = GFDb.getProjects();

        const studentCount = users.filter(u => u.role === "student").length;
        const supervisorCount = users.filter(u => u.role === "supervisor").length;
        const projectCount = projects.length;

        document.getElementById("admin-stat-students").textContent = studentCount;
        document.getElementById("admin-stat-faculty").textContent = supervisorCount;
        document.getElementById("admin-stat-submissions").textContent = projectCount;

        // Render Allocations Table
        const allocTbody = document.getElementById("allocation-table-body");
        if (projects.length > 0) {
          allocTbody.innerHTML = projects.map(p => {
            let badgeClass = "badge-pending";
            if (p.status === "graded") badgeClass = "badge-graded";
            if (p.status === "revision") badgeClass = "badge-revision";

            return `
              <tr>
                <td><strong>${p.studentName}</strong></td>
                <td>${p.department}</td>
                <td>${p.supervisorName}</td>
                <td><span class="badge ${badgeClass}">${p.status}</span></td>
              </tr>
            `;
          }).join('');
        } else {
          allocTbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">No project submissions recorded</td></tr>`;
        }

        // Render Notifications/Activity Feed
        const activityPanel = document.getElementById("admin-activity-panel");
        const notifications = GFDb.getNotifications().slice(0, 10); // top 10

        if (notifications.length > 0) {
          activityPanel.innerHTML = notifications.map(n => `
            <div class="notification-item">
              <div>${n.message}</div>
              <div class="notification-time">${n.createdAt}</div>
            </div>
          `).join('');
        } else {
          activityPanel.innerHTML = `<div style="text-align:center; color:var(--text-secondary); padding:20px;">No system log records</div>`;
        }
      }

      // Initial stats load
      reloadStats();

      // Modal Elements Control
      const modal = document.getElementById("alloc-modal");
      const openBtn = document.getElementById("open-alloc-btn");
      const closeBtn = document.getElementById("close-alloc-modal");

      openBtn.addEventListener("click", () => {
        // Load eligible projects & supervisors
        const projects = GFDb.getProjects();
        const supervisors = GFDb.getUsers().filter(u => u.role === "supervisor");

        const studentSelect = document.getElementById("modal-student-select");
        const supervisorSelect = document.getElementById("modal-supervisor-select");

        studentSelect.innerHTML = `<option value="">Select Project</option>` + 
          projects.map(p => `<option value="${p.id}">${p.studentName} — ${p.projectTitle}</option>`).join('');

        supervisorSelect.innerHTML = `<option value="">Select Faculty</option>` + 
          supervisors.map(s => `<option value="${s.id}">${s.name} (${s.department})</option>`).join('');

        modal.classList.add("active");
      });

      closeBtn.addEventListener("click", () => {
        modal.classList.remove("active");
      });

      // Handle Modal form submit
      document.getElementById("alloc-form").addEventListener("submit", (e) => {
        e.preventDefault();
        
        const projectId = document.getElementById("modal-student-select").value;
        const supervisorId = document.getElementById("modal-supervisor-select").value;

        const supervisorSelect = document.getElementById("modal-supervisor-select");
        const supervisorName = supervisorSelect.options[supervisorSelect.selectedIndex].text.split(' (')[0];

        if (!projectId || !supervisorId) {
          alert("Please select both a student project and a supervisor.");
          return;
        }

        const projects = GFDb.getProjects();
        const pIndex = projects.findIndex(p => p.id === projectId);
        
        if (pIndex !== -1) {
          projects[pIndex].supervisorId = supervisorId;
          projects[pIndex].supervisorName = supervisorName;
          
          GFDb.saveProjects(projects);

          // Log Notification Activity
          GFDb.addNotification({
            id: "not-" + Date.now(),
            userId: "admin",
            message: `Supervisor assigned: Allocated ${supervisorName} to ${projects[pIndex].studentName}.`,
            createdAt: new Date().toLocaleString()
          });

          alert("Allocation updated successfully!");
          modal.classList.remove("active");
          reloadStats();
        }
      });
    }
  </script>
</body>
</html>
